name: Patch MovieBox Keep Awake

on:
  workflow_dispatch:
  push:
    paths:
      - '*.apk'
      - '*.zip'
      - '.github/workflows/patch-moviebox.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.11.1.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Reconstruct APK from uploaded ZIPs if needed
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find . -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)
          if [ -n "$APK" ]; then
            echo "path=$APK" >> "$GITHUB_OUTPUT"
            echo "Using APK already in repository: $APK"
            exit 0
          fi

          mkdir -p extracted_parts
          shopt -s nullglob
          ZIPS=(./*.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo 'No APK or ZIP parts found in repository root.' >&2
            exit 1
          fi

          for z in "${ZIPS[@]}"; do
            echo "Inspecting $z"
            unzip -l "$z" || true
            d="extracted_parts/$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -o "$z" -d "$d"
          done

          APK=$(find extracted_parts -type f -name '*.apk' | head -n 1 || true)
          if [ -n "$APK" ]; then
            echo "Found APK inside archive: $APK"
            cp "$APK" reconstructed.apk
          else
            mapfile -t PARTS < <(find extracted_parts -type f | sort -V)
            if [ ${#PARTS[@]} -eq 0 ]; then
              echo 'ZIPs extracted but contained no files.' >&2
              exit 1
            fi
            echo 'No complete APK found; concatenating extracted files in natural order:'
            printf '  %s\n' "${PARTS[@]}"
            cat "${PARTS[@]}" > reconstructed.apk
          fi

          echo 'Testing reconstructed APK as ZIP container...'
          unzip -t reconstructed.apk >/tmp/apk-test.txt
          tail -n 5 /tmp/apk-test.txt
          echo "path=reconstructed.apk" >> "$GITHUB_OUTPUT"
          ls -lh reconstructed.apk

      - name: Decompile APK
        run: |
          apktool d -f "${{ steps.apk.outputs.path }}" -o decompiled

      - name: Find DetailPlayerActivity smali
        id: player
        shell: bash
        run: |
          FILE=$(find decompiled -type f -path '*/com/transsion/tvui/activity/DetailPlayerActivity.smali' | head -n 1)
          if [ -z "$FILE" ]; then
            echo 'DetailPlayerActivity.smali not found.' >&2
            find decompiled -type f -iname '*PlayerActivity*.smali' | head -n 50 || true
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Found $FILE"

      - name: Patch playback activity with FLAG_KEEP_SCREEN_ON
        shell: python
        env:
          PLAYER_FILE: ${{ steps.player.outputs.file }}
        run: |
          import os, re, pathlib
          p = pathlib.Path(os.environ['PLAYER_FILE'])
          text = p.read_text(encoding='utf-8')

          method_match = re.search(r'\.method[^\n]* onCreate\(Landroid/os/Bundle;\)V\n', text)
          if not method_match:
              raise SystemExit('DetailPlayerActivity.onCreate not found')

          start = method_match.start()
          end = text.find('.end method', start)
          if end < 0:
              raise SystemExit('Could not determine onCreate method end')
          block = text[start:end]

          if 'Landroid/view/Window;->addFlags(I)V' in block and '0x80' in block:
              print('FLAG_KEEP_SCREEN_ON patch already present')
          else:
              locals_m = re.search(r'(?m)^\s*\.locals\s+(\d+)\s*$', block)
              regs_m = re.search(r'(?m)^\s*\.registers\s+(\d+)\s*$', block)
              if locals_m:
                  n = int(locals_m.group(1))
                  if n < 2:
                      block = block[:locals_m.start(1)] + '2' + block[locals_m.end(1):]
              elif regs_m:
                  n = int(regs_m.group(1))
                  block = block[:regs_m.start(1)] + str(n + 2) + block[regs_m.end(1):]
              else:
                  raise SystemExit('No .locals or .registers directive in onCreate')

              pattern = r'(invoke-super \{p0, p1\}, [^\n]*->onCreate\(Landroid/os/Bundle;\)V\n)'
              injection = (
                  r'\1'
                  '\n    # Keep screen awake while the movie player is open\n'
                  '    invoke-virtual {p0}, Landroid/app/Activity;->getWindow()Landroid/view/Window;\n'
                  '    move-result-object v0\n'
                  '    const/16 v1, 0x80\n'
                  '    invoke-virtual {v0, v1}, Landroid/view/Window;->addFlags(I)V\n'
              )
              block2, count = re.subn(pattern, injection, block, count=1)
              if count != 1:
                  raise SystemExit('Could not locate invoke-super onCreate call')
              block = block2
              text = text[:start] + block + text[end:]
              p.write_text(text, encoding='utf-8')
              print(f'Patched {p}')

      - name: Rebuild unsigned APK
        run: |
          apktool b decompiled -o MovieBox_keep_awake_UNSIGNED.apk

      - name: Verify rebuilt APK
        run: |
          test -s MovieBox_keep_awake_UNSIGNED.apk
          unzip -t MovieBox_keep_awake_UNSIGNED.apk >/dev/null
          ls -lh MovieBox_keep_awake_UNSIGNED.apk

      - name: Upload rebuilt APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-keep-awake-unsigned
          path: MovieBox_keep_awake_UNSIGNED.apk
          if-no-files-found: error
