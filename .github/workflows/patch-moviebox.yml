name: Patch MovieBox Keep Awake

on:
  workflow_dispatch:
  push:
    paths:
      - '*.apk'
      - '.github/workflows/patch-moviebox.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.11.1.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Locate original APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo 'No APK found in repository root.' >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Using $APK"

      - name: Decompile APK
        run: |
          apktool d -f "${{ steps.apk.outputs.path }}" -o decompiled

      - name: Find DetailPlayerActivity smali
        id: player
        shell: bash
        run: |
          FILE=$(find decompiled -type f -path '*/com/transsion/tvui/activity/DetailPlayerActivity.smali' | head -n 1)
          if [ -z "$FILE" ]; then
            echo 'DetailPlayerActivity.smali not found.' >&2
            find decompiled -type f -iname '*PlayerActivity*.smali' | head -n 50 || true
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Found $FILE"

      - name: Patch player activity with FLAG_KEEP_SCREEN_ON
        shell: python
        env:
          PLAYER_FILE: ${{ steps.player.outputs.file }}
        run: |
          import os, re, pathlib
          p = pathlib.Path(os.environ['PLAYER_FILE'])
          text = p.read_text(encoding='utf-8')

          # Patch onCreate immediately after the invoke-super call. This avoids
          # any XML/resource changes and keeps the fix scoped to the real player activity.
          m = re.search(r'(\.method[^\n]* onCreate\(Landroid/os/Bundle;\)V.*?\n)(.*?)(invoke-super \{p0, p1\}, [^\n]*->onCreate\(Landroid/os/Bundle;\)V\n)', text, re.S)
          if not m:
            raise SystemExit('Could not locate DetailPlayerActivity.onCreate super call')

          method_start = m.group(1)
          body_before_super = m.group(2)
          super_call = m.group(3)

          # Ensure at least one local register is available for Window object.
          method_block_start = m.start()
          method_end = text.find('.end method', method_block_start)
          if method_end == -1:
            raise SystemExit('Could not determine onCreate method extent')
          block = text[method_block_start:method_end]

          locals_match = re.search(r'\n\s*\.locals\s+(\d+)', block)
          regs_match = re.search(r'\n\s*\.registers\s+(\d+)', block)
          if locals_match:
            n = int(locals_match.group(1))
            if n < 1:
              block = block[:locals_match.start(1)] + '1' + block[locals_match.end(1):]
              # reconstruct text temporarily below
          elif regs_match:
            n = int(regs_match.group(1))
            # p0,p1 already consume 2 regs; add one scratch register conservatively
            block = block[:regs_match.start(1)] + str(n + 1) + block[regs_match.end(1):]
          else:
            raise SystemExit('No .locals or .registers directive found in onCreate')

          injection = '''\n    # Keep screen awake while DetailPlayerActivity is visible\n    invoke-virtual {p0}, Landroid/app/Activity;->getWindow()Landroid/view/Window;\n    move-result-object v0\n    const/16 v1, 0x80\n    invoke-virtual {v0, v1}, Landroid/view/Window;->addFlags(I)V\n'''

          # We need two locals (v0 and v1). Adjust locals/registers in the actual method block.
          block = text[method_block_start:method_end]
          locals_match = re.search(r'\n\s*\.locals\s+(\d+)', block)
          regs_match = re.search(r'\n\s*\.registers\s+(\d+)', block)
          if locals_match:
            n = int(locals_match.group(1))
            if n < 2:
              block = block[:locals_match.start(1)] + '2' + block[locals_match.end(1):]
          elif regs_match:
            n = int(regs_match.group(1))
            block = block[:regs_match.start(1)] + str(n + 2) + block[regs_match.end(1):]

          # Insert after invoke-super inside the adjusted method block.
          block = re.sub(
            r'(invoke-super \{p0, p1\}, [^\n]*->onCreate\(Landroid/os/Bundle;\)V\n)',
            r'\1' + injection,
            block,
            count=1,
          )
          if injection.strip() not in block:
            raise SystemExit('Injection failed')

          text = text[:method_block_start] + block + text[method_end:]
          p.write_text(text, encoding='utf-8')
          print(f'Patched {p}')

      - name: Ensure WAKE_LOCK permission
        shell: python
        run: |
          from pathlib import Path
          p = Path('decompiled/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          perm = '<uses-permission android:name="android.permission.WAKE_LOCK" />'
          if 'android.permission.WAKE_LOCK' not in text:
            idx = text.find('>') + 1
            text = text[:idx] + '\n    ' + perm + text[idx:]
            p.write_text(text, encoding='utf-8')
            print('Added WAKE_LOCK permission')
          else:
            print('WAKE_LOCK permission already present')

      - name: Rebuild unsigned APK
        run: |
          apktool b decompiled -o MovieBox_keep_awake_UNSIGNED.apk

      - name: Verify APK exists
        run: |
          test -s MovieBox_keep_awake_UNSIGNED.apk
          ls -lh MovieBox_keep_awake_UNSIGNED.apk

      - name: Upload rebuilt APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-keep-awake-unsigned
          path: MovieBox_keep_awake_UNSIGNED.apk
          if-no-files-found: error
